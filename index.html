<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f5f4a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1412" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Official REDA greeting cards for every occasion, all year round."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <title>REDA Cards</title>

    <meta property="og:title" content="REDA Cards" />
    <meta property="og:description" content="Celebrate Every Occasion" />
    <meta property="og:type" content="website" />

    <!-- Applied before first paint so the page never flashes light-then-dark,
         nor LTR-then-RTL. Keys match ThemeSwitcher and src/i18n/index.js. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (!t) {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          if (t === "dark") document.documentElement.classList.add("dark");

          var l = localStorage.getItem("reda-lang");
          if (l === "ar" || l === "en") {
            document.documentElement.lang = l;
            document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
          }
        } catch (e) {
          /* private mode: fall through to the markup defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
