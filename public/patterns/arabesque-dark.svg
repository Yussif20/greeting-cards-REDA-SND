<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <g fill="none" stroke="#E9F1EC" stroke-opacity="0.055" stroke-width="1.1">
    <!-- Eight-pointed khatam at each corner and centre, joined by a lattice. -->
    <g id="khatam">
      <rect x="-14" y="-14" width="28" height="28" transform="translate(100 100)"/>
      <rect x="-14" y="-14" width="28" height="28" transform="translate(100 100) rotate(45)"/>
    </g>
    <use href="#khatam" transform="translate(-100 -100)"/>
    <use href="#khatam" transform="translate(100 -100)"/>
    <use href="#khatam" transform="translate(-100 100)"/>
    <use href="#khatam" transform="translate(100 100)"/>
    <path d="M0 0 L100 100 L200 0 M0 200 L100 100 L200 200"/>
    <path d="M100 0 L100 40 M100 160 L100 200 M0 100 L40 100 M160 100 L200 100"/>
    <circle cx="100" cy="100" r="4"/>
    <circle cx="0" cy="0" r="4"/>
    <circle cx="200" cy="0" r="4"/>
    <circle cx="0" cy="200" r="4"/>
    <circle cx="200" cy="200" r="4"/>
  </g>
</svg>
